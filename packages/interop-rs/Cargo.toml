[package]
name = "mdbase-interop"
version = "0.1.0-rc.2"
edition = "2021"
license = "MIT"
description = "Rust models and validation for mdbase event/action interoperability profile 0.1."
repository = "https://github.com/mdbase-dev/mdbase-spec"
homepage = "https://mdbase.dev/interop/"
include = ["src/**", "schemas/**", "README.md", "LICENSE"]

[lib]
name = "mdbase_interop"
path = "src/lib.rs"

[dependencies]
hex = "0.4"
jsonschema = { version = "0.18", features = ["draft202012"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
sha2 = "0.10"
