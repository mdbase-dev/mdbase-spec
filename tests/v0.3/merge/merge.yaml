            line3
          conflicts: []
      - name: "A field change and a body change merge. (prototype fixture field-vs-body)"
        id: merge.field_vs_body
        since: 0.3.0-rc.5
        covers: [merge.field_three_way, merge.body_three_way]
        operation: merge_records
        input:
          path: tasks/T.md
