# Three-way record merge fixtures (Chapter 12A).
#
# Each merge_records test supplies the base, first, and second versions of one
# record. "first" is the earlier-ordered version; at a conflict the merged
# document keeps its value. expect.document is the exact merged bytes and
# expect.conflicts lists every conflict by kind and field, in key order.
#
# The first group converts the 13 fixtures of the mdbase-next feasibility
# prototype (reference/prototype/crates/mdb-core/tests/merge_fixtures): the
# prototype's "theirs" (sequenced first) is "first" and its "ours" (the
# incoming external edit) is "second". The prototype spelled the max
# declaration as an x-merge schema annotation; here it is collection.merge.
name: "three-way record merge"
spec_version: "0.3.0"
fixture_set: merge
category: merge
spec_ref: "v0.3/07, v0.3/12A"
groups:
  - name: "prototype merge fixtures (TaskNotes-like task type)"
    setup:
      config: |
        spec_version: "0.3.0"
      types:
        task.md: |
          ---
          kind: mdbase.type
          name: task
          match:
            path_glob: "tasks/**/*.md"
          schema:
            dialect: json-schema-2020-12
            value:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1 }
                status: { type: string, enum: [open, doing, done] }
                priority: { type: integer, minimum: 1, maximum: 5 }
                blocked_by: { type: array, uniqueItems: true, items: { type: string } }
                completedDate: { type: string }
          collection:
            read_defaults:
              status: open
            unique:
              - field: code
                scope: type
                enforce: write
            links:
              blocked_by[]:
                target_type: task
            path:
              pattern: "tasks/{title}.md"
            merge:
              completedDate: max
          lifecycle:
            on_create:
              - if: '!has(raw.id)'
                set:
                  id: { ulid: true }
              - set:
                  dateCreated: { now: true }
                  dateModified: { now: true }
            on_update:
              set:
                dateModified: { now: true }
          ---
          # Task
    tests:
      - name: "Both append different lines at the end: union (theirs first), no conflict. (prototype fixture body-append-append)"
        id: merge.body_append_append
        since: 0.3.0-rc.5
        covers: [merge.append_append_union]
        operation: merge_records
        input:
          path: tasks/T.md
          base: |
            ---
            type: task
            title: T # keep me
            status: open
            priority: 2
            tags: [a, b]
            dateModified: 2026-10-01T00:00:00.000Z
            ---
            - one
          first: |
            ---
            type: task
            title: T # keep me
            status: open
            priority: 2
            tags: [a, b]
            dateModified: 2026-10-01T00:00:00.000Z
            ---
            - one
            - theirs
          second: |
            ---
            type: task
            title: T # keep me
            status: open
            priority: 2
            tags: [a, b]
            dateModified: 2026-10-01T00:00:00.000Z
            ---
            - one
            - ours
        expect:
          document: |
            ---
            type: task
            title: T # keep me
            status: open
            priority: 2
            tags: [a, b]
            dateModified: 2026-10-01T00:00:00.000Z
            ---
            - one
            - theirs
            - ours
          conflicts: []
      - name: "Different body lines edited: both kept. (prototype fixture body-disjoint-hunks)"
        id: merge.body_disjoint_hunks
        since: 0.3.0-rc.5
        covers: [merge.body_three_way]
        operation: merge_records
        input:
          path: tasks/T.md
          base: |
            ---
            type: task
            title: T # keep me
            status: open
            priority: 2
            tags: [a, b]
            dateModified: 2026-10-01T00:00:00.000Z
            ---
            l1
            l2
            l3
            l4
            l5
            l6
          first: |
            ---
            type: task
            title: T # keep me
            status: open
            priority: 2
            tags: [a, b]
            dateModified: 2026-10-01T00:00:00.000Z
            ---
            l1 theirs
            l2
            l3
            l4
            l5
            l6
          second: |
            ---
            type: task
            title: T # keep me
            status: open
            priority: 2
            tags: [a, b]
            dateModified: 2026-10-01T00:00:00.000Z
            ---
            l1
            l2
            l3
            l4
            l5
            l6 ours
        expect:
          document: |
            ---
            type: task
            title: T # keep me
            status: open
            priority: 2
            tags: [a, b]
            dateModified: 2026-10-01T00:00:00.000Z
            ---
            l1 theirs
            l2
            l3
            l4
            l5
            l6 ours
