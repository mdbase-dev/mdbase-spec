  - name: merge declarations across several matched types
    setup:
      config: |
        spec_version: "0.3.0"
      types:
        alpha.md: |
          ---
          kind: mdbase.type
          name: alpha
          version: 1
          match:
            path_glob: "shared/**/*.md"
          schema:
            dialect: json-schema-2020-12
            value: { type: object }
          collection:
            merge:
              rank: max
              note: union
          ---
        beta.md: |
          ---
          kind: mdbase.type
          name: beta
          version: 1
          match:
            path_glob: "shared/**/*.md"
          schema:
            dialect: json-schema-2020-12
            value: { type: object }
          collection:
            merge:
              rank: min
              note: union
          ---
    tests:
      - name: different declarations for one field from two matched types are a type_conflict
        id: merge.declaration_type_conflict
        since: 0.3.0-rc.5
        covers: [collection_semantics.merge_declarations]
        operation: merge_strategies
        input:
          path: shared/x.md
          document: |
            ---
            rank: 1
            ---
        expect:
          error:
            code: type_conflict
            field: rank
      - name: identical declarations from two matched types coalesce
        id: merge.declaration_coalesce
        since: 0.3.0-rc.5
        covers: [collection_semantics.merge_declarations]
        operation: merge_strategies
        input:
          path: shared/x.md
          document: |
            ---
            note: [a]
            ---
          fields: [note]
        expect:
          strategies:
            note: union
      - name: "a type_conflict between declarations merges the field as a conflict"
        id: merge.declaration_type_conflict_in_merge
        since: 0.3.0-rc.5
        covers: [collection_semantics.merge_declarations, merge.conflict_reporting]
        operation: merge_records
        input:
          path: shared/x.md
          base: |
            ---
            rank: 1
            ---
          first: |
            ---
            rank: 2
            ---
          second: |
            ---
            rank: 3
            ---
        expect:
          document: |
            ---
            rank: 2
            ---
          conflicts:
            - kind: field
              field: rank
