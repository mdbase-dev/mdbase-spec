                score: { type: number }
                reviewers: { type: array, uniqueItems: true, items: { type: string } }
                labels: { type: array, items: { type: string } }
          collection:
            merge:
              firstSeen: min
              lastSeen: max
              score: max
              dateModified: conflict
          lifecycle:
            on_update:
