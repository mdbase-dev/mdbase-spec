name: "Floating date-time validation"
spec_version: "0.3.0"
fixture_set: core_collection
category: validation
spec_ref: "v0.3/04, v0.3/06"

groups:
  - name: "local-date-time syntax"
    setup:
      config: |
        spec_version: "0.3.0"
        settings: { timezone: UTC }
      types:
        clocks.md: |
          ---
          kind: mdbase.type
          name: clocks
          version: 1
          match: { path_glob: "clocks/**/*.md" }
          schema:
            dialect: json-schema-2020-12
            value:
              type: object
              additionalProperties: { type: string, format: local-date-time }
          ---
      files:
        clocks/valid.md: |
          ---
          minutes: "2026-11-27T08:00"
          seconds: "2026-11-27T08:00:00"
          fraction: "2026-11-27T08:00:00.5"
          precision: "2026-11-27T08:00:00.0123456789"
          leap_day: "2024-02-29T12:00"
          ---
        clocks/invalid.md: |
          ---
          hour: "2026-11-27T24:00"
          minute: "2026-11-27T08:60"
          day: "2026-02-30T08:00"
          utc: "2026-11-27T08:00:00Z"
          offset: "2026-11-27T08:00:00+10:00"
          date_only: "2026-11-27"
          space: "2026-11-27 08:00"
          minute_fraction: "2026-11-27T08:00.5"
          empty_fraction: "2026-11-27T08:00:00."
          unicode_fraction: "2026-11-27T08:00:00.٥"
          ---
    tests:
      - name: "accept valid dates and optional seconds and fractions"
        id: core.local_date_time_valid
        covers: [core_read.json_schema_formats]
        operation: validate
        input: { path: clocks/valid.md }
        expect: { valid: true, issues: [] }

      - name: "report each invalid local-date-time at its field"
        id: core.local_date_time_invalid
        covers: [core_read.json_schema_formats]
        operation: validate
        input: { path: clocks/invalid.md }
        expect:
          valid: false
          issues:
            - { code: format_invalid, field: hour }
            - { code: format_invalid, field: minute }
            - { code: format_invalid, field: day }
            - { code: format_invalid, field: utc }
            - { code: format_invalid, field: offset }
            - { code: format_invalid, field: date_only }
            - { code: format_invalid, field: space }
            - { code: format_invalid, field: minute_fraction }
            - { code: format_invalid, field: empty_fraction }
            - { code: format_invalid, field: unicode_fraction }

  - name: "a missing collection timezone is a record warning"
    setup:
      config: |
        spec_version: "0.3.0"
        settings: { validation: error }
      types:
        event.md: |
          ---
          kind: mdbase.type
          name: event
          version: 1
          match: { path_glob: "events/**/*.md" }
          schema:
            dialect: json-schema-2020-12
            value:
              type: object
              properties:
                at: { type: string, format: local-date-time }
                instant_only: { type: string, format: date-time }
          ---
      files:
        events/existing.md: |
          ---
          at: "2026-11-27T08:00"
          ---
        events/wrong-format.md: |
          ---
          instant_only: "2026-11-27T08:00"
          ---
    tests:
      - name: "a floating value needs a collection timezone at validation error"
        id: core.timezone_required_error
        covers: [core_read.machine_readable_diagnostics]
        operation: validate
        input: { path: events/existing.md }
        expect:
          valid: true
          issues: [{ code: timezone_required, severity: warning, field: at }]

      - name: "a floating value in a date-time-only field reports only format_invalid without a zone"
        id: core.date_time_only_rejects_floating_without_timezone_warning
        covers: [core_read.json_schema_formats, core_read.machine_readable_diagnostics]
        operation: validate
        input: { path: events/wrong-format.md }
        expect:
          valid: false
          issues: [{ code: format_invalid, severity: error, field: instant_only }]

      - name: "a floating value needs a collection timezone at validation warn"
        id: core.timezone_required_warn
        covers: [core_read.machine_readable_diagnostics]
        operation: validate
        setup:
          config: |
            spec_version: "0.3.0"
            settings: { validation: warn }
        input: { path: events/existing.md }
        expect:
          valid: true
          issues: [{ code: timezone_required, severity: warning, field: at }]

      - name: "the warning permits writing the floating value at validation error"
        id: core.timezone_required_write
        covers: [core_write.validation_tiers]
        operation: create
        input:
          path: events/new.md
          type: event
          frontmatter: { at: "2026-11-27T08:00" }
        expect:
          valid: true
          frontmatter: { at: "2026-11-27T08:00" }
          diagnostics: [{ code: timezone_required, severity: warning, field: at }]

      - name: "a configured timezone leaves persisted and effective frontmatter floating"
        id: core.local_date_time_frontmatter
        covers: [core_read.json_schema_formats]
        operation: read
        setup:
          config: |
            spec_version: "0.3.0"
            settings: { timezone: Australia/Melbourne }
        input: { path: events/existing.md }
        expect:
          valid: true
          frontmatter: { at: "2026-11-27T08:00" }
          effective_frontmatter: { at: "2026-11-27T08:00" }
          diagnostics: []
