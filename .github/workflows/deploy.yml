name: Build tagged specification artifact

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: specification-artifact
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Upload versioned artifact
        uses: actions/upload-artifact@v7
        with:
          name: mdbase-spec-site-${{ github.ref_name }}
          path: site/dist
